<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Journal de Trading</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--card2:#1b2430;--line:#243040;--tx:#e8eef5;--mut:#8a98a8;--g:#22c55e;--r:#ef4444;--gold:#e0b341;--acc:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px 90px}
h1{font-size:18px;margin:2px 0 12px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-weight:500;color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center}
.kpi b{display:block;font-size:16px;margin-top:2px}
.kpi span{font-size:11px;color:var(--mut)}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0e141bf2;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--r);color:#fff}
.btn.full{width:100%}
.ic{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
.calcard{padding:12px 8px}
.ctitle{font-size:15px;font-weight:700}.csub{font-size:12px;color:var(--mut);margin:2px 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.2fr;gap:4px}
.cal .wd{font-size:9.5px;color:var(--mut);text-align:center;padding:2px 0;letter-spacing:.05em;font-weight:600}
.cell{aspect-ratio:1/1.12;border-radius:8px;background:var(--card2);border:1.5px solid transparent;padding:3px 2px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:hidden;min-width:0}
.cell.out{background:transparent;pointer-events:none;opacity:.35}
.cell.today{border-color:var(--gold)}
.cell .d{align-self:flex-start;color:var(--mut);font-size:9.5px;padding-left:2px;line-height:1}
.cell .p{font-weight:700;font-size:9.5px;line-height:1;white-space:nowrap}
.cell .n{font-size:7.5px;opacity:.8;line-height:1;white-space:nowrap}
.cell.g1{background:#8fd3a0;color:#0b3d1a}.cell.g2{background:#3fae5a;color:#fff}.cell.g3{background:#14702f;color:#fff}
.cell.l1{background:#efb0b0;color:#5b1010}.cell.l2{background:#d9534f;color:#fff}.cell.l3{background:#8f1d1d;color:#fff}
.cell.be{background:#3a4350;color:#e8eef5}
.cell[class*=" g"] .d,.cell[class*=" l"] .d,.cell.be .d{color:inherit;opacity:.75}
.wkc{border-radius:8px;background:var(--card2);padding:3px 2px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;min-width:0}
.wkc span{font-size:7.5px;color:var(--mut);letter-spacing:.04em;white-space:nowrap}
.wkc b{font-size:9.5px;white-space:nowrap}
.wkc.pos{background:#12341f}.wkc.neg{background:#3a1717}
.legbar{height:5px;border-radius:9px;background:linear-gradient(90deg,#8f1d1d,#d9534f,#efb0b0,#3a4350,#8fd3a0,#3fae5a,#14702f);margin:2px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--mut);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:76px;height:76px}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.shot button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:99px;border:0;background:var(--r);color:#fff;font-size:12px;line-height:1}
.addshot{position:relative;width:76px;height:76px;margin:0!important;border:1.5px dashed var(--mut);border-radius:10px;display:flex!important;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:11px;gap:2px;text-align:center}
.addshot b{font-size:22px;line-height:1;color:var(--tx)}
.thumbs{display:flex;gap:6px;margin:-2px 0 8px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
#viewer:not(:empty){position:fixed;inset:0;background:#000e;z-index:30;display:flex;align-items:center;justify-content:center;padding:10px}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}
#viewer button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:17px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);background:var(--card2);border-radius:11px;margin-bottom:7px}
.tr .t1{font-weight:700}.tr .t2{font-size:12px;color:var(--mut);margin-top:2px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:#243040;color:var(--mut);margin-right:3px}
.tag.buy{background:#12341f;color:var(--g)}.tag.sell{background:#3a1717;color:var(--r)}
label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.seg button.on.b{background:var(--g);color:#04210f;border-color:var(--g)}
.seg button.on.s{background:var(--r);color:#fff;border-color:var(--r)}
.seg button.on.y{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.seg button.on.n{background:#475569;color:#fff}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{flex:1;padding:7px 4px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-size:12px;color:var(--mut)}
.chips button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.bar{height:6px;background:#243040;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
.grow{padding:8px 0;border-bottom:1px solid var(--line)}.grow:last-child{border:0}
.warn{background:#3a2a10;border:1px solid #6b4a12;color:#f3c76b;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
textarea.box{min-height:130px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
h3{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="viewer"></div>
<div class="nav"><div id="nav"></div></div>

<script>
const KEY='journal_trading_v1';
const SETUPS=['FVG','Order Block','BOS','CHoCH','Liquidity Sweep','Breaker','OTE (Premium/Discount)','Autre'];
const SESSIONS=['Londres','New York','Asie','Hors killzone'];
const MISTAKES=['Aucune','Revenge trading','Overtrading','FOMO','SL déplacé','Hors checklist','Entrée anticipée'];
const PAIRS=['EURUSD','GBPUSD','XAUUSD','USDJPY','GBPJPY','AUDUSD','USDCAD','NAS100','US30','BTCUSD'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
let S={capital:1000,trades:[]};
let storageOK=true;
let tab='cal',period='all';
const now=new Date();
let cy=now.getFullYear(),cm=now.getMonth();

/* ---------- images (IndexedDB + memoire) ---------- */
const IMG={};let DB=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open('journal_imgs',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbPut(id,v){if(!DB)return;try{DB.transaction('i','readwrite').objectStore('i').put(v,id)}catch(e){}}
function idbDel(id){if(!DB)return;try{DB.transaction('i','readwrite').objectStore('i').delete(id)}catch(e){}}
function idbAll(){return new Promise(r=>{if(!DB)return r();try{const q=DB.transaction('i').objectStore('i').openCursor();q.onsuccess=()=>{const c=q.result;if(c){IMG[c.key]=c.value;c.continue()}else r()};q.onerror=()=>r()}catch(e){r()}})}
function delImg(id){delete IMG[id];idbDel(id)}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=url})}
function thumbs(t){const a=(t.imgs||[]).filter(i=>IMG[i]);return a.length?`<div class="thumbs">${a.map(i=>`<img src="${IMG[i]}" data-act="view" data-i="${i}" alt="capture">`).join('')}</div>`:''}
/* ---------- storage ---------- */
function load(){
  try{
    localStorage.setItem('_t','1');localStorage.removeItem('_t');
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.trades))S=o}
  }catch(e){storageOK=false}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}
}
/* ---------- utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function num(v){const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null}
function money(n,sign){
  if(n==null||isNaN(n))return '—';
  const a=Math.abs(n);const s=a>=1000?a.toLocaleString('fr-FR',{maximumFractionDigits:0}):(Math.round(a*100)/100).toString();
  return (n<0?'-':(sign&&n>0?'+':''))+s+'$';
}
const cls=n=>n>0?'g':n<0?'r':'m';
function longDate(s){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][dt.getDay()]+' '+d+' '+MOIS[m-1]+' '+y}
const sorted=l=>l.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
function byDay(){const m={};S.trades.forEach(t=>{(m[t.date]=m[t.date]||[]).push(t)});return m}
function filtered(){
  const t=sorted(S.trades);
  if(period==='month'){const p=cy+'-'+pad(cm+1);return t.filter(x=>x.date.startsWith(p))}
  if(period==='30'){const d=new Date();d.setDate(d.getDate()-30);const c=ymd(d);return t.filter(x=>x.date>=c)}
  return t;
}

/* ---------- stats ---------- */
function calc(list){
  const n=list.length;
  const wins=list.filter(t=>t.pnl>0),loss=list.filter(t=>t.pnl<0),be=n-wins.length-loss.length;
  const gw=wins.reduce((a,t)=>a+t.pnl,0),gl=loss.reduce((a,t)=>a+t.pnl,0);
  const total=gw+gl;
  let eq=S.capital,peak=eq,mdd=0,mddPct=0;const curve=[eq];
  list.forEach(t=>{eq+=t.pnl;curve.push(eq);if(eq>peak)peak=eq;const dd=peak-eq;if(dd>mdd){mdd=dd;mddPct=peak>0?dd/peak*100:0}});
  const rs=list.filter(t=>t.r!=null).map(t=>t.r);
  return{n,w:wins.length,l:loss.length,be,total,gw,gl,
    wr:n?wins.length/n*100:0,
    pf:gl<0?gw/Math.abs(gl):(gw>0?Infinity:0),
    avgW:wins.length?gw/wins.length:0,avgL:loss.length?gl/loss.length:0,
    exp:n?total/n:0,mdd,mddPct,curve,end:eq,
    best:n?Math.max(...list.map(t=>t.pnl)):0,worst:n?Math.min(...list.map(t=>t.pnl)):0,
    avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null};
}
function group(list,key){
  const m={};list.forEach(t=>{const k=t[key]||'—';(m[k]=m[k]||[]).push(t)});
  return Object.entries(m).map(([k,v])=>({k,n:v.length,wr:v.filter(t=>t.pnl>0).length/v.length*100,pnl:v.reduce((a,t)=>a+t.pnl,0)})).sort((a,b)=>b.pnl-a.pnl);
}
function equitySVG(curve,cap){
  if(curve.length<2)return '<div class="empty">Ajoutez des trades pour voir la courbe d’équité.</div>';
  const W=360,H=190,pl=8,pr=8,pt=14,pb=18;
  let mn=Math.min(...curve,cap),mx=Math.max(...curve,cap);
  if(mx===mn){mx+=1;mn-=1}
  const padv=(mx-mn)*.12;mn-=padv;mx+=padv;
  const X=i=>pl+(W-pl-pr)*i/(curve.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const pts=curve.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  const up=curve[curve.length-1]>=cap,col=up?'#22c55e':'#ef4444';
  const area='M'+pts[0]+' L'+pts.join(' L')+' L'+X(curve.length-1).toFixed(1)+','+(H-pb)+' L'+X(0).toFixed(1)+','+(H-pb)+' Z';
  const by=Y(cap).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe d'équité">
  <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#gr)"/>
  <line x1="${pl}" x2="${W-pr}" y1="${by}" y2="${by}" stroke="#8a98a8" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/>
  <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${X(curve.length-1).toFixed(1)}" cy="${Y(curve[curve.length-1]).toFixed(1)}" r="4" fill="${col}"/>
  <text x="${pl}" y="${H-4}" fill="#8a98a8" font-size="10">Départ ${money(cap)}</text>
  <text x="${W-pr}" y="${H-4}" fill="#8a98a8" font-size="10" text-anchor="end">Trade ${curve.length-1}</text>
  <text x="${W-pr}" y="11" fill="${col}" font-size="11" font-weight="700" text-anchor="end">${money(curve[curve.length-1])}</text></svg>`;
}

/* ---------- views ---------- */
function dm(n){const a=Math.abs(n);const t=a>=100?Math.round(a).toLocaleString('fr-FR'):(Math.round(a*100)/100).toString();return (n<0?'-':n>0?'+':'')+'$'+t}
function vCal(){
  const bd=byDay(),dim=new Date(cy,cm+1,0).getDate(),off=new Date(cy,cm,1).getDay(),pd=new Date(cy,cm,0).getDate();
  const dayP={};let maxAbs=0,mp=0,mn=0,mw=0;
  for(let d=1;d<=dim;d++){const ts=bd[cy+'-'+pad(cm+1)+'-'+pad(d)]||[];if(ts.length){const p=ts.reduce((a,t)=>a+t.pnl,0);dayP[d]={p,n:ts.length};maxAbs=Math.max(maxAbs,Math.abs(p));mp+=p;mn+=ts.length;mw+=ts.filter(t=>t.pnl>0).length}}
  const lvl=p=>{if(p===0)return 'be';const r=Math.abs(p)/(maxAbs||1);return (p>0?'g':'l')+(r>=.6?3:r>=.25?2:1)};
  const weeks=Math.ceil((off+dim)/7);
  let cells='';
  for(let w=0;w<weeks;w++){
    let wp=0,wn=0;
    for(let c=0;c<7;c++){
      const day=w*7+c-off+1;
      if(day<1||day>dim){cells+=`<div class="cell out"><span class="d">${day<1?pd+day:day-dim}</span><span></span><span></span></div>`;continue}
      const ds=cy+'-'+pad(cm+1)+'-'+pad(day),x=dayP[day];
      if(x){wp+=x.p;wn+=x.n}
      cells+=`<button class="cell ${x?lvl(x.p):''} ${ds===todayStr()?'today':''}" data-act="day" data-d="${ds}"><span class="d">${day}</span>${x?`<span class="p">${dm(x.p)}</span><span class="n">${x.n} trade${x.n>1?'s':''}</span>`:'<span></span><span></span>'}</button>`;
    }
    cells+=`<div class="wkc ${wn?(wp>0?'pos':wp<0?'neg':''):''}"><span>SEM ${w+1}</span><b class="${wn?cls(wp):'m'}">${wn?dm(wp):'$0'}</b><span>${wn} trade${wn>1?'s':''}</span></div>`;
  }
  const leg=[['#8f1d1d','Grosse perte'],['#d9534f','Perte modérée'],['#efb0b0','Petite perte'],['#3a4350','Aucun trade'],['#8fd3a0','Petit gain'],['#3fae5a','Gain modéré'],['#14702f','Gros gain']];
  return `<h1>Journal <small>ICT / SMC</small></h1>
  ${storageOK?'':'<div class="warn">Sauvegarde automatique indisponible dans ce navigateur : exportez régulièrement vos données (onglet Réglages).</div>'}
  <div class="kpis">
    <div class="kpi"><span>P&amp;L du mois</span><b class="${cls(mp)}">${money(mp,true)}</b></div>
    <div class="kpi"><span>Trades</span><b>${mn}</b></div>
    <div class="kpi"><span>Winrate</span><b>${mn?Math.round(mw/mn*100)+'%':'—'}</b></div>
  </div>
  <div class="card calcard">
    <div class="ctitle">Calendrier de performance</div><div class="csub">Vue d’ensemble de vos résultats</div>
    <div class="row sp" style="margin-bottom:10px">
      <button class="ic" data-act="prev">‹</button>
      <b style="font-size:16px;text-transform:capitalize">${MOIS[cm]} ${cy}</b>
      <button class="ic" data-act="next">›</button>
    </div>
    <div class="row sp m" style="font-size:10px"><span>Perte</span><span>Gain</span></div><div class="legbar"></div>
    <div class="legend">${leg.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>
    <div class="cal">${JOURS.map(j=>`<div class="wd">${j}</div>`).join('')}<div class="wd">SEMAINE</div>${cells}</div>
    <div class="m" style="font-size:10.5px;margin-top:8px">Intensité des couleurs relative au meilleur / pire jour du mois.</div>
  </div>
  <button class="btn full" data-act="add" data-d="${todayStr()}">+ Nouveau trade</button>`;
}

function trRow(t){
  return `<button class="tr" data-act="edit" data-id="${t.id}" style="width:100%;text-align:left">
    <div><div class="t1">${esc(t.pair)} <span class="tag ${t.dir==='Buy'?'buy':'sell'}">${t.dir}</span></div>
    <div class="t2">${esc(t.time||'')} ${t.setup?'· '+esc(t.setup):''} ${t.session?'· '+esc(t.session):''}</div></div>
    <div style="text-align:right"><b class="${cls(t.pnl)}">${money(t.pnl,true)}</b>${t.r!=null?`<div class="t2">${t.r>0?'+':''}${t.r}R</div>`:''}</div></button>`;
}
function vTrades(){
  const l=sorted(S.trades).reverse();
  let html='<h1>Trades <small>'+l.length+' au total</small></h1><button class="btn full" data-act="add" data-d="'+todayStr()+'" style="margin-bottom:12px">+ Nouveau trade</button>';
  if(!l.length)return html+'<div class="empty">Aucun trade pour l’instant.</div>';
  let cur='';
  l.forEach(t=>{if(t.date!==cur){cur=t.date;html+=`<div class="m" style="font-size:12px;margin:12px 2px 6px;text-transform:capitalize">${longDate(cur)}</div>`}html+=trRow(t)+thumbs(t)});
  return html;
}
function vStats(){
  const L=filtered(),s=calc(L);
  const chips=[['all','Tout'],['month','Mois affiché'],['30','30 jours']].map(([k,t])=>`<button class="${period===k?'on':''}" data-act="per" data-k="${k}">${t}</button>`).join('');
  let h=`<h1>Statistiques <small>automatique</small></h1><div class="chips">${chips}</div>`;
  if(!s.n)return h+'<div class="empty">Ajoutez des trades pour voir vos statistiques.</div>';
  h+=`<div class="kpis">
   <div class="kpi"><span>P&amp;L total</span><b class="${cls(s.total)}">${money(s.total,true)}</b></div>
   <div class="kpi"><span>Winrate</span><b>${s.wr.toFixed(1)}%</b></div>
   <div class="kpi"><span>Profit factor</span><b>${s.pf===Infinity?'∞':s.pf.toFixed(2)}</b></div>
   <div class="kpi"><span>Trades</span><b>${s.n}</b><span>${s.w}G · ${s.l}P · ${s.be}BE</span></div>
   <div class="kpi"><span>Espérance</span><b class="${cls(s.exp)}">${money(s.exp,true)}</b></div>
   <div class="kpi"><span>Drawdown max</span><b class="r">${money(-s.mdd)}</b><span>${s.mddPct.toFixed(1)}%</span></div>
  </div>
  <div class="card"><h3>Courbe d’équité</h3>${equitySVG(s.curve,S.capital)}</div>
  <div class="card"><h3>Détails</h3>
   <div class="row sp grow"><span class="m">Gain moyen</span><b class="g">${money(s.avgW,true)}</b></div>
   <div class="row sp grow"><span class="m">Perte moyenne</span><b class="r">${money(s.avgL)}</b></div>
   <div class="row sp grow"><span class="m">Meilleur / pire trade</span><b><span class="g">${money(s.best,true)}</span> / <span class="r">${money(s.worst)}</span></b></div>
   ${s.avgR!=null?`<div class="row sp grow"><span class="m">R moyen</span><b class="${cls(s.avgR)}">${s.avgR.toFixed(2)}R</b></div>`:''}
   <div class="row sp grow"><span class="m">Capital actuel</span><b>${money(s.end)}</b></div>
  </div>`;
  const gr=(title,key)=>{
    const g=group(L,key);
    return `<div class="card"><h3>${title}</h3>${g.map(x=>`<div class="grow"><div class="row sp"><b>${esc(x.k)}</b><span><span class="m">${x.n} · ${Math.round(x.wr)}% · </span><b class="${cls(x.pnl)}">${money(x.pnl,true)}</b></span></div><div class="bar"><i style="width:${x.wr}%"></i></div></div>`).join('')}</div>`;
  };
  h+=gr('Par setup','setup')+gr('Par session / killzone','session')+gr('Par paire','pair');
  const ok=L.filter(t=>t.plan!==false),ko=L.filter(t=>t.plan===false);
  const line=(lbl,a)=>a.length?`<div class="row sp grow"><span>${lbl} <span class="m">(${a.length})</span></span><span>${Math.round(a.filter(t=>t.pnl>0).length/a.length*100)}% · <b class="${cls(a.reduce((x,t)=>x+t.pnl,0))}">${money(a.reduce((x,t)=>x+t.pnl,0),true)}</b></span></div>`:'';
  const mk=group(L.filter(t=>t.mistake&&t.mistake!=='Aucune'),'mistake');
  h+=`<div class="card"><h3>Discipline</h3>${line('Plan respecté',ok)}${line('Hors plan',ko)}
   ${mk.map(x=>`<div class="row sp grow"><span class="m">${esc(x.k)} (${x.n})</span><b class="${cls(x.pnl)}">${money(x.pnl,true)}</b></div>`).join('')}</div>`;
  return h;
}
function vSet(){
  return `<h1>Réglages</h1>
  <div class="card"><label style="margin-top:0">Capital de départ ($)</label>
   <div class="row"><input id="cap" inputmode="decimal" value="${S.capital}"><button class="btn" data-act="cap">OK</button></div></div>
  <div class="card"><h3>Sauvegarde</h3>
   <p class="m" style="margin:0 0 10px;font-size:13px">Vos trades sont enregistrés sur cet appareil. Copiez la sauvegarde pour la conserver ou la transférer. Les captures d’écran restent sur cet appareil et ne sont pas incluses dans l’export.</p>
   <div class="row"><button class="btn sec" data-act="expjson" style="flex:1">Exporter JSON</button><button class="btn sec" data-act="expcsv" style="flex:1">Exporter CSV</button></div>
   <textarea class="box" id="io" placeholder="Export ici, ou collez une sauvegarde JSON pour importer" style="margin-top:10px"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn sec" data-act="copy" style="flex:1">Copier</button><button class="btn" data-act="imp" style="flex:1">Importer</button></div>
   <div id="iomsg" class="m" style="font-size:12.5px;margin-top:8px"></div></div>
  <div class="card"><h3>Zone sensible</h3><button class="btn red full" data-act="reset" id="rst">Effacer toutes les données</button></div>`;
}

/* ---------- modals ---------- */
function closeM(){if(form&&form._orig){form.imgs.filter(i=>!form._orig.includes(i)).forEach(delImg)}form=null;delArm=false;$('#modal').innerHTML=''}
const $=s=>document.querySelector(s);
function openDay(ds){
  const ts=sorted(S.trades.filter(t=>t.date===ds)),p=ts.reduce((a,t)=>a+t.pnl,0);
  $('#modal').innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet">
   <div class="row sp"><h2 style="text-transform:capitalize">${longDate(ds)}</h2><button class="ic" data-act="close">✕</button></div>
   <div class="row sp" style="margin-bottom:10px"><span class="m">P&amp;L du jour</span><b class="${cls(p)}" style="font-size:20px">${ts.length?money(p,true):'—'}</b></div>
   <div class="row sp" style="margin-bottom:10px"><span class="m">Trades de la session</span><b class="${ts.length>3?'r':''}">${ts.length}/3</b></div>
   ${ts.length>3?'<div class="warn">Limite de 3 trades dépassée ce jour-là.</div>':''}
   ${ts.map(t=>trRow(t)+thumbs(t)).join('')||'<div class="empty">Aucun trade ce jour.</div>'}
   <button class="btn full" data-act="add" data-d="${ds}" style="margin-top:6px">+ Ajouter un trade</button></div></div>`;
}
let form=null;
function openForm(t){
  form=Object.assign({dir:'Buy',plan:true,emo:3,mistake:'Aucune',session:'Londres',setup:'FVG'},t);
  form.imgs=(t.imgs||[]).slice();form._orig=form.imgs.slice();
  renderForm();
}
function opts(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function renderForm(){
  const f=form,edit=!!f.id;const oldS=document.querySelector('.sheet'),sc=oldS?oldS.scrollTop:0;
  $('#modal').innerHTML=`<div class="sheet-bg" data-act="bg"><div class="sheet">
  <div class="row sp"><h2>${edit?'Modifier le trade':'Nouveau trade'}</h2><button class="ic" data-act="close">✕</button></div>
  <div class="g2"><div><label>Date</label><input type="date" id="f_date" value="${f.date}"></div><div><label>Heure</label><input type="time" id="f_time" value="${f.time||''}"></div></div>
  <div class="g2"><div><label>Paire / actif</label><input id="f_pair" list="pairs" value="${esc(f.pair||'')}" autocapitalize="characters" placeholder="EURUSD"><datalist id="pairs">${PAIRS.map(p=>`<option>${p}</option>`).join('')}</datalist></div>
  <div><label>Sens</label><div class="seg"><button class="${f.dir==='Buy'?'on b':''}" data-act="dir" data-v="Buy">Buy</button><button class="${f.dir==='Sell'?'on s':''}" data-act="dir" data-v="Sell">Sell</button></div></div></div>
  <div class="g2"><div><label>Session / killzone</label><select id="f_session">${opts(SESSIONS,f.session)}</select></div><div><label>Setup ICT/SMC</label><select id="f_setup">${opts(SETUPS,f.setup)}</select></div></div>
  <div class="g3"><div><label>Lot</label><input id="f_lots" inputmode="decimal" value="${f.lots??''}"></div><div><label>Entrée</label><input id="f_entry" inputmode="decimal" value="${f.entry??''}"></div><div><label>SL</label><input id="f_sl" inputmode="decimal" value="${f.sl??''}"></div></div>
  <div class="g3"><div><label>TP</label><input id="f_tp" inputmode="decimal" value="${f.tp??''}"></div><div><label>P&amp;L ($) *</label><input id="f_pnl" inputmode="decimal" value="${f.pnl??''}" placeholder="+25 ou -10"></div><div><label>R obtenu</label><input id="f_r" inputmode="decimal" value="${f.r??''}" placeholder="2.0"></div></div>
  <label>Checklist 8 points respectée ?</label>
  <div class="seg"><button class="${f.plan?'on y':''}" data-act="plan" data-v="1">Oui</button><button class="${!f.plan?'on n':''}" data-act="plan" data-v="0">Non</button></div>
  <div class="g2"><div><label>État émotionnel (1-5)</label><select id="f_emo">${[1,2,3,4,5].map(i=>`<option ${i===+f.emo?'selected':''}>${i}</option>`).join('')}</select></div><div><label>Erreur</label><select id="f_mistake">${opts(MISTAKES,f.mistake)}</select></div></div>
  <label>Captures d’écran</label>
  <div class="shots">${f.imgs.map(id=>`<div class="shot"><img src="${IMG[id]||''}" data-act="view" data-i="${id}" alt="capture"><button data-act="rmimg" data-i="${id}" aria-label="Retirer">✕</button></div>`).join('')}
   <label class="addshot"><b>+</b>Ajouter<input type="file" id="f_files" accept="image/*" multiple style="position:absolute;opacity:0;width:0;height:0"></label></div>
  <label>Notes / leçon</label><textarea id="f_notes" placeholder="Contexte, biais HTF, ce que j’ai bien / mal fait…">${esc(f.notes||'')}</textarea>
  <div id="ferr" class="r" style="font-size:13px;margin-top:6px"></div>
  <div class="row" style="margin-top:12px">${edit?'<button class="btn red" data-act="del" id="delb">Supprimer</button>':''}<button class="btn" data-act="save" style="flex:1">Enregistrer</button></div>
  </div></div>`;
  const ns=document.querySelector('.sheet');if(ns)ns.scrollTop=sc;
}
function readForm(){
  const v=id=>$('#'+id).value;
  Object.assign(form,{date:v('f_date'),time:v('f_time'),pair:v('f_pair').trim().toUpperCase(),session:v('f_session'),setup:v('f_setup'),
    lots:num(v('f_lots')),entry:num(v('f_entry')),sl:num(v('f_sl')),tp:num(v('f_tp')),pnl:num(v('f_pnl')),r:num(v('f_r')),
    emo:+v('f_emo'),mistake:v('f_mistake'),notes:v('f_notes').trim()});
}

/* ---------- render / events ---------- */
const ICONS={
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
 trades:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>',
 set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'};
function render(){
  $('#app').innerHTML={cal:vCal,trades:vTrades,stats:vStats,set:vSet}[tab]();
  $('#nav').innerHTML=[['cal','Calendrier'],['trades','Trades'],['stats','Stats'],['set','Réglages']].map(([k,t])=>`<button class="${tab===k?'on':''}" data-act="tab" data-k="${k}">${ICONS[k]}${t}</button>`).join('');
}
let delArm=false,rstArm=false;
function toCSV(){
  const h=['date','heure','paire','sens','session','setup','lot','entree','sl','tp','pnl','R','plan_respecte','emotion','erreur','notes'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return [h.join(',')].concat(sorted(S.trades).map(t=>[t.date,t.time,t.pair,t.dir,t.session,t.setup,t.lots,t.entry,t.sl,t.tp,t.pnl,t.r,t.plan?'oui':'non',t.emo,t.mistake,t.notes].map(q).join(','))).join('\n');
}
document.addEventListener('click',e=>{if(e.target.closest('#viewer')&&!e.target.closest('[data-act="vclose"]')){$('#viewer').innerHTML=''}});
document.addEventListener('change',async e=>{
  if(e.target.id!=='f_files'||!form)return;
  const files=[...e.target.files];if(!files.length)return;
  readForm();
  for(const f of files){try{const d=await compress(f);const id=uid();IMG[id]=d;idbPut(id,d);form.imgs.push(id)}catch(_){}}
  renderForm();
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='bg'){if(e.target===el)closeM();return}
  if(a==='close'){closeM();return}
  if(a==='tab'){tab=el.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='prev'){cm--;if(cm<0){cm=11;cy--}render()}
  else if(a==='next'){cm++;if(cm>11){cm=0;cy++}render()}
  else if(a==='per'){period=el.dataset.k;render()}
  else if(a==='day')openDay(el.dataset.d);
  else if(a==='add')openForm({date:el.dataset.d,time:pad(new Date().getHours())+':'+pad(new Date().getMinutes())});
  else if(a==='edit'){const t=S.trades.find(x=>x.id===el.dataset.id);if(t)openForm(Object.assign({},t))}
  else if(a==='view'){const src=IMG[el.dataset.i];if(src)$('#viewer').innerHTML=`<img src="${src}" alt="capture"><button class="ic" data-act="vclose">✕</button>`}
  else if(a==='vclose'){$('#viewer').innerHTML=''}
  else if(a==='rmimg'){readForm();form.imgs=form.imgs.filter(i=>i!==el.dataset.i);renderForm()}
  else if(a==='dir'){readForm();form.dir=el.dataset.v;renderForm()}
  else if(a==='plan'){readForm();form.plan=el.dataset.v==='1';renderForm()}
  else if(a==='save'){
    readForm();
    if(!form.date||!form.pair||form.pnl==null){$('#ferr').textContent='Date, paire et P&L sont obligatoires.';return}
    form._orig.filter(i=>!form.imgs.includes(i)).forEach(delImg);delete form._orig;
    if(form.id){const i=S.trades.findIndex(x=>x.id===form.id);S.trades[i]=form}else{form.id=uid();S.trades.push(form)}
    save();const d=form.date;
    const [y,m]=d.split('-').map(Number);cy=y;cm=m-1;
    form=null;closeM();render();
  }
  else if(a==='del'){
    if(!delArm){delArm=true;el.textContent='Confirmer la suppression';return}
    delArm=false;(S.trades.find(x=>x.id===form.id)?.imgs||[]).forEach(delImg);S.trades=S.trades.filter(x=>x.id!==form.id);save();form=null;closeM();render();
  }
  else if(a==='cap'){const v=num($('#cap').value);if(v!=null&&v>=0){S.capital=v;save();render()}}
  else if(a==='expjson'){$('#io').value=JSON.stringify(S);$('#iomsg').textContent='Sauvegarde générée : copiez-la.'}
  else if(a==='expcsv'){$('#io').value=toCSV();$('#iomsg').textContent='CSV généré : copiez-le pour Excel / Sheets.'}
  else if(a==='copy'){
    const t=$('#io');t.select();
    try{await navigator.clipboard.writeText(t.value);$('#iomsg').textContent='Copié.'}catch(_){$('#iomsg').textContent='Sélectionnez le texte et copiez-le manuellement.'}
  }
  else if(a==='imp'){
    try{
      const o=JSON.parse($('#io').value);
      if(!o||!Array.isArray(o.trades))throw 0;
      S={capital:+o.capital||1000,trades:o.trades.filter(t=>t&&t.date&&typeof t.pnl==='number').map(t=>Object.assign({id:uid()},t))};
      save();render();
      setTimeout(()=>{const m=$('#iomsg');if(m)m.textContent='Import réussi : '+S.trades.length+' trades.'},0);
    }catch(_){$('#iomsg').textContent='Format invalide : collez une sauvegarde JSON exportée ici.'}
  }
  else if(a==='reset'){
    if(!rstArm){rstArm=true;el.textContent='Confirmer : tout effacer';return}
    rstArm=false;S={capital:S.capital,trades:[]};save();render();
  }
});
load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
idbOpen().then(d=>{DB=d;return idbAll()}).then(()=>{if(!document.querySelector('.sheet'))render()});
</script>
</body>
</html>
